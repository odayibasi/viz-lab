name: Refresh static snapshot

# Backend olmadan çalışan GitHub Pages sürümü için her gün veri anlık görüntüsünü yeniler.
# Değişiklik olursa commit atar; bu push deploy workflow'unu tetikler.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GH_DATA_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ vars.GITHUB_LOGIN || github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/
          git diff --cached --quiet || git commit -m "chore(data): refresh snapshot"
          git push
