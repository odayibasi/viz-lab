name: Fetch GitHub data

# Her gün 03:00 UTC'de gerçek veriyi çekip data/github.json'u günceller.
# Değişiklik olursa commit atar; bu push deploy workflow'unu tetikler.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fetch-data
        env:
          # Varsayılan GITHUB_TOKEN contributions verisini okuyabilir; özel ihtiyaç için
          # repo secret'ı olarak GH_DATA_TOKEN tanımlayabilirsin.
          GITHUB_TOKEN: ${{ secrets.GH_DATA_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ vars.GITHUB_LOGIN || github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          git diff --cached --quiet || git commit -m "chore(data): update github.json"
          git push
